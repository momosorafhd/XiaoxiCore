# Optional DSH Web virtual host. Install together with the Core virtual host.
map $http_upgrade $xiaoxi_connection {
    default upgrade;
    '' close;
}
server {
    listen 9443 ssl;
    server_name assistant.home.arpa;
    ssl_certificate /etc/nginx/tls/assistant.crt;
    ssl_certificate_key /etc/nginx/tls/assistant.key;
    allow 127.0.0.1;
    allow 10.50.0.0/24;
    deny all;
    access_log off;

    location = /_owner {
        internal;
        proxy_pass http://127.0.0.1:18910/_gateway-auth;
        proxy_method GET;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host assistant.home.arpa;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        # Private file with the single proxy_set_header directive described in docs/LAN.md.
        include /etc/nginx/private/xiaoxi-gateway.inc;
    }
    location @owner_login {
        if ($uri ~ ^/api(?:/|$)) { return 401; }
        return 303 https://assistant.home.arpa/login?return_to=https%3A%2F%2Fassistant.home.arpa%3A9443%2F;
    }
    location / {
        auth_request /_owner;
        error_page 401 = @owner_login;
        auth_request_set $dsh_cookie $upstream_http_x_xixi_dsh_cookie;
        auth_request_set $owner_session $upstream_http_x_xixi_owner_session;
        auth_request_set $owner_expires $upstream_http_x_xixi_owner_expires;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host assistant.home.arpa:9443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $dsh_cookie;
        proxy_set_header X-Xixi-Owner-Session $owner_session;
        proxy_set_header X-Xixi-Owner-Expires $owner_expires;
        proxy_set_header X-Xixi-Gateway-Token "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xiaoxi_connection;
        proxy_hide_header Set-Cookie;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
