# Install in the nginx http context after adapting the example domain, subnet and certificates.
server {
    listen 443 ssl;
    server_name assistant.home.arpa;
    ssl_certificate /etc/nginx/tls/assistant.crt;
    ssl_certificate_key /etc/nginx/tls/assistant.key;
    allow 127.0.0.1;
    allow 10.50.0.0/24;
    deny all;
    access_log off;

    location = /_gateway-auth { return 404; }
    location = /_qq-owner-auth { return 404; }
    location ^~ /api/bridge/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18910;
        proxy_set_header Host assistant.home.arpa;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Xixi-Gateway-Token "";
    }
}
